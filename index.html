<!DOCTYPE html>
<html>
  <head>
    <title>Travel Order Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>Travel Order Entry Form</h1>

      <div class="form-section">
        <label>Name</label>
        <input type="text" id="name" />

        <label>Position</label>
        <input type="text" id="position" />

        <label>Salary per Month</label>
        <input type="text" id="salary" />

        <label>Office Station</label>
        <input type="text" id="station" />

        <label>Departure Date</label>
        <input type="date" id="departure" />

        <label>Return Date</label>
        <input type="date" id="return" />

        <label>Destination</label>
        <input type="text" id="destination" />

        <label>Specific Purpose of Trip</label>
        <textarea id="purpose"></textarea>

        <label>Objectives</label>
        <textarea id="objective"></textarea>

        <label>Per Diem Allowed</label>
        <input type="text" id="perdiem" />

        <label>Assistant Laborers Allowed</label>
        <input type="text" id="laborers" />

        <label>Appropriation</label>
        <input type="text" id="appropriation" />

        <label>Means of Transportation</label>
        <input type="text" id="transport" />

        <label>Remarks</label>
        <textarea id="remarks"></textarea>

        <button onclick="generateTravelOrder()">Generate Travel Order</button>

        <button id="printBtn" onclick="window.print()" style="display: none">
          Print Travel Order
        </button>
      </div>

      <hr />

      <!-- OUTPUT SECTION -->
      <div id="output" class="travel-order">
        <!-- HEADER -->
        <div class="header">
          <div class="header-left">
            <img src="image.png" class="logo" />
          </div>

          <div class="header-center">
            <h4>Republic of the Philippines</h4>
            <h3>DEPARTMENT OF AGRICULTURE</h3>
            <h4>Caraga Region</h4>
            <h4>Capitol Site, Butuan City</h4>
            <h4>Tel. No: (085) 342-4092 Telefax No.: (085) 341-2114</h4>
           
          
            <div class="double-line"></div>
          <div class="header-title">TRAVEL ORDER</div>
        </div>
      </div>

      <!-- NO & DATE -->
      <div class="order-info">
        <div>No.: __________________________</div>
        <div>Date: _________________________</div>
      </div>

      <!-- DETAILS -->
      <div class="details-grid">
        <div class="field">
          <label>Name:</label>
          <span id="oName"></span>
        </div>

        <div class="field">
          <label>Salary per Month:</label>
          <span id="oSalary"></span>
        </div>

        <div class="field">
          <label>Position:</label>
          <span id="oPosition"></span>
        </div>

        <div class="field">
          <label>Office Station:</label>
          <span id="oStation"></span>
        </div>

        <div class="field">
          <label>Departure:</label>
          <span id="oDeparture"></span>
        </div>

        <div class="field">
          <label>Return Date:</label>
          <span id="oReturn"></span>
        </div>
      </div>

      <!-- FULL WIDTH -->
      <div class="full-field">
        <label>Destination:</label>
        <span id="oDestination"></span>
      </div>

      <div class="full-field">
        <label>Purpose:</label>
        <span id="oPurpose"></span>
      </div>

      <div class="full-field">
        <label>Objectives:</label>
        <span id="oObjective"></span>
      </div>

      <div class="full-field">
        <label>Per Diem Allowed:</label>
        <span id="oPerdiem"></span>
      </div>

      <div class="full-field">
        <label>Assistant Laborers Allowed:</label>
        <span id="oLaborers"></span>
      </div>

      <div class="full-field">
        <label>Appropriation:</label>
        <span id="oAppropriation"></span>
      </div>

      <div class="full-field">
        <label>Means of Transportation:</label>
        <span id="oTransport"></span>
      </div>

      <div class="full-field">
        <label>Remarks:</label>
        <span id="oRemarks"></span>
      </div>

      <!-- SIGNATURES -->
      <div class="signature">
        <div class="sign-box">
          <div class="line"></div>
          Recommending Approval
        </div>

        <div class="sign-box">
          <div class="line"></div>
          Approved
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
