<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel Order</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="form-container">

  <div class="header">
    <img src="logo.png" alt="DA Logo" class="logo">
    <div>
      <h2>Republic of the Philippines</h2>
      <h3>DEPARTMENT OF AGRICULTURE</h3>
      <p>Caraga Region</p>
    </div>
  </div>

  <h1>TRAVEL ORDER</h1>

  <form id="travelForm">

    <div class="grid">
      <label>No: <input type="text" id="toNo" readonly></label>
      <label>Date: <input type="date"></label>

      <label>Name: <input type="text"></label>
      <label>Salary per Month: <input type="text"></label>

      <label>Position: <input type="text"></label>
      <label>Office Station: <input type="text"></label>

      <label>Departure: <input type="date"></label>
      <label>Return Date: <input type="date"></label>

      <label>Destination: <input type="text"></label>
    </div>

    <label>Specific Purpose of the Trip:</label>
    <textarea></textarea>

    <label>Objective(s):</label>
    <textarea></textarea>

    <label>Means of Transportation:</label>
    <input type="text">

    <button type="submit">Submit</button>

  </form>

</div>

<script src="script.js"></script>
</body>
</html>
